name: 缺陷报告
description: 报告可以稳定复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 提交前请删除服务器地址、密码、IP、Steam64、玩家 UID 和存档路径。
  - type: input
    id: version
    attributes:
      label: 工具版本
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Palworld 服务端版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序描述如何触发问题。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或截图
